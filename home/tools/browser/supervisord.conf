[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[program:display]
command=Xvfb :99 -screen 0 1440x900x24 -ac -nolisten tcp
user=browser
autorestart=true
priority=10

[program:window-manager]
command=openbox
user=browser
environment=HOME="/home/browser"
autorestart=true
priority=20

[program:chromium]
command=/usr/local/bin/start-browser
user=browser
environment=HOME="/home/browser"
autorestart=true
priority=30
stopasgroup=true
killasgroup=true

[program:cdp-proxy]
command=socat TCP-LISTEN:9223,bind=0.0.0.0,reuseaddr,fork TCP:127.0.0.1:9222
autorestart=true

[program:vnc]
command=x11vnc -display :99 -forever -shared -nopw -localhost -rfbport 5900
user=browser
autorestart=true

[program:novnc]
command=websockify --web=/usr/share/novnc/ 6080 localhost:5900
user=browser
autorestart=true
